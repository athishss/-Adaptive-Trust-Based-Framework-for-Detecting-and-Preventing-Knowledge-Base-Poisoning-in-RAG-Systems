[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-rag-person-a"
version = "0.1.0"
description = "TRACE-RAG Person A: provenance-aware retrieval, cheap poisoning signals, grounded generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7"]
models = ["torch>=2.1", "transformers>=4.40"]
docs = ["pypdf>=3.17", "beautifulsoup4>=4.12"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = ["faiss-cpu>=1.7", "torch>=2.1", "transformers>=4.40", "pypdf>=3.17",
       "beautifulsoup4>=4.12", "pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
trace-rag = "trace_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:trace_rag.*"]
