# Experimental single-device PyTorch/XLA configuration for full BEIR NQ.
# Contriever embeddings and NLI verification use TPU/XLA; FAISS IVF-PQ and
# SQLite stay on CPU. Full indexing is long-running; run_trust_stream checkpoints
# every 50k newly embedded passages and can resume with --skip-index.
# BEIR NQ contains 2,681,468 passages but no authorship or original timestamps.
# The Colab notebook derives source IDs from authentic page titles and uses
# wall-clock import times; controlled attacker/poison events remain generated.
seed: 20260921

ingestion:
  chunk_words: 100
  chunk_overlap_words: 20
  family_backend: exact

embedding:
  backend: huggingface
  model_name: facebook/contriever
  device: tpu
  batch_size: 8
  max_length: 512
  normalize: true

index:
  backend: faiss
  faiss_kind: ivfpq
  nlist: 4096
  pq_m: 96
  nbits: 8
  nprobe: 16

retrieval:
  candidate_pool: 50
  top_k: 5
  trust_lambda: 1.0
  trust_floor: 0.05

signals:
  neighbourhood_k: 10
  min_corpus_for_isolation: 10000

scorer:
  target_high_fpr: 0.02
  escalation_budget: 1.0
  calibration: isotonic

trust:
  enabled: true
  w_s: 1.0
  w_r: 2.0
  w_max: 5.0
  prior_weight: 5.0
  kappa: 3.0
  t_cap: 0.6
  decay_gamma: 0.95
  decay_interval: 100
  quarantine_refutations: 2
  reject_refutations: 3
  hierarchical: true
  recovery_threshold: 0.6
  quarantine_t_eff: 0.2
  monitored_t_eff: 0.6
  burst_trust_discount: 0.3
  burst_window_seconds: 60.0
  burst_min_docs: 4
  cold_start_influence: 0.25
  source_age_ramp_hours: 24.0
  cold_start_min_observations: 5
  record_history: true
  queue_max_size: 1000
  verifier_max_corroboration: 3
  verifier_support_threshold: 0.15
  verifier_refute_threshold: 0.10
  verifier_min_mass: 0.20
  verifier_max_source_mass: 0.6
  verifier_counterfactual_influence: true
  nli_mode: nli

generation:
  backend: ollama
  model_name: qwen2.5:3b
  temperature: 0.0
  seed: 20260921
  max_tokens: 96
  max_context_docs: 5
  abstain_evidence_mass: 0.5
  require_citations: true
  check_citations: false
  timeout_s: 180.0

storage:
  root: runs/nq_tpu
  trust_db: trust.sqlite3
