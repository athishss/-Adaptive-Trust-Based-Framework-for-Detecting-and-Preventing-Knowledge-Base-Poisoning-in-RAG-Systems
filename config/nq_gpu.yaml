# Natural Questions on one CUDA GPU.
#
#   conda activate trace-rag
#   python scripts/download_data.py --dataset nq --out data/nq --subset 200000
#   trace-rag --config config/nq_gpu.yaml ingest-beir --corpus data/nq/corpus_subset.parquet
#   trace-rag --config config/nq_gpu.yaml index
#   trace-rag --config config/nq_gpu.yaml query "who designed the eiffel tower?"
seed: 20260921

ingestion:
  chunk_words: 100
  chunk_overlap_words: 20
  family_backend: exact      # minhash needs ~5 GB of RAM on the full corpus

embedding:
  backend: huggingface
  model_name: facebook/contriever
  revision: 2bd46a25019aeea091fd42d1f0fd4801675cf699
  precision: float32
  device: auto               # GPU when one is visible, otherwise CPU (with a warning)
  batch_size: 128            # drop to 32 if you hit CUDA out-of-memory
  normalize: true

index:
  backend: faiss
  faiss_kind: flat           # exact; fine up to ~500k passages (768-d float32 ~ 3 GB per 1M)
  # for the full 2.68M corpus switch to:
  # faiss_kind: ivfpq
  # nlist: 4096
  # pq_m: 96                 # must divide 768
  # nprobe: 16

retrieval:
  candidate_pool: 50
  top_k: 5
  trust_lambda: 1.0
  trust_floor: 0.05

signals:
  neighbourhood_k: 10
  min_corpus_for_isolation: 10000

scorer:
  model_path: null           # set to runs/nq/scorer.joblib once trained
  target_high_fpr: 0.02
  escalation_budget: 1.0
  calibration: isotonic

generation:
  backend: openai            # an OpenAI-compatible server: vLLM, or Ollama below
  model_name: meta-llama/Llama-3.1-8B-Instruct
  revision: a09a35458c702b33eeacc393d103063234e8bc28
  precision: bfloat16
  quantization: null         # unquantised research model (server must confirm)
  serving_version: 0.7.3     # vLLM target; OpenAI API does not expose it for verification
  base_url: http://localhost:8000/v1
  temperature: 0.0
  seed: 20260921
  max_context_docs: 5
  abstain_evidence_mass: 0.5
  require_citations: true
  # laptop / no vLLM alternative:
  # backend: ollama
  # model_name: llama3.1:8b
  # base_url: http://localhost:11434

security:
  enabled: true
  verifier: nli             # cross-encoder/nli-deberta-v3-base; falls back loudly
  nli_model: cross-encoder/nli-deberta-v3-base
  nli_revision: 6c749ce3425cd33b46d187e45b92bbf96ee12ec7
  max_corroboration: 3
  queue_size: 1000
  drain_queue: true
  fail_open_without_verifier: false

trust:
  quarantine_refutations: 2
  reject_refutations: 3
  burst_window_seconds: 60.0
  burst_min_docs: 4

storage:
  root: runs/nq
