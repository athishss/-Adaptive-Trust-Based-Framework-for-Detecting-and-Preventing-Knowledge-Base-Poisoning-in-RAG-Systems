# TRACE-RAG - Person A default configuration (development / offline)
# Every threshold in the plan lives here.  Nothing is hard-coded in the source.
seed: 20260921

ingestion:
  chunk_words: 100            # matches BEIR passage size
  chunk_overlap_words: 20
  min_chunk_words: 15
  minhash_perm: 64            # near-duplicate "family" detection
  minhash_bands: 16
  shingle_width: 3
  family_threshold: 0.6
  family_backend: minhash     # minhash | exact | none  (exact for full-corpus runs)
  burst_window_hours: 24.0

embedding:
  backend: hashing            # -> huggingface for real runs
  model_name: facebook/contriever
  dim: 256                    # hashing backend only
  batch_size: 32
  device: cpu
  normalize: true

index:
  backend: numpy              # -> faiss for the full corpora
  faiss_kind: flat            # flat | ivfpq | hnsw
  nlist: 4096
  pq_m: 96
  nbits: 8
  hnsw_m: 32
  nprobe: 16

retrieval:
  candidate_pool: 50          # K'
  top_k: 5                    # k passages given to the generator
  trust_lambda: 1.0           # score = similarity * t_eff ** lambda
  trust_floor: 0.05           # cold-start fairness: new honest sources stay reachable
  exclude_blocked: true

signals:
  neighbourhood_k: 10
  cluster_similarity_threshold: 0.8
  burst_window_hours: 24.0
  source_mature_days: 180.0
  source_mature_docs: 50
  duplicate_threshold: 0.95
  min_corpus_for_isolation: 10000
  enabled: {}                 # e.g. {s3: false} for ablations

scorer:
  model_path: null            # path to a trained scorer; null -> heuristic fallback
  target_high_fpr: 0.02       # clean passages allowed into the HIGH band
  escalation_budget: 1.0      # mean MEDIUM escalations per query
  theta_low: 0.30             # overwritten by select_thresholds on validation
  theta_high: 0.75
  C: 1.0
  calibration: isotonic
  random_state: 20260921

generation:
  backend: stub               # -> openai (vLLM) / ollama / huggingface
  # NOTE: stub + hashing embeddings are offline test backends.  Their output is
  # a smoke test, never a real-model experiment (see docs/ENGINEERING_REPORT.md).
  model_name: meta-llama/Llama-3.1-8B-Instruct
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.0
  seed: 20260921
  max_tokens: 256
  max_context_docs: 5
  abstain_evidence_mass: 0.5  # tau_ans
  require_citations: true
  check_citations: false      # true once Person B's NLI checker is wired in
  timeout_s: 120.0

storage:
  root: runs/default
  provenance_db: provenance.sqlite3
  answer_db: answers.sqlite3
  trust_db: trust.sqlite3
  index_path: index
  scorer_path: scorer.joblib

# Time model.  wall = production timestamps; logical = deterministic
# epoch + step * step_seconds for simulations and tests.
time:
  mode: wall
  epoch: 1700000000.0
  step_seconds: 3600.0

# Person B trust-ledger thresholds.  Every value is validated by pydantic.
trust:
  hierarchical: true
  support_doc_alpha: 1.0
  refute_doc_beta: 2.0
  prior_weight: 5.0
  kappa: 3.0
  t_cap: 0.6
  decay_gamma: 0.95
  decay_interval: 100
  quarantine_refutations: 2
  reject_refutations: 3
  quarantine_t_eff: 0.20
  monitored_t_eff: 0.60
  burst_window_seconds: 60.0
  burst_min_docs: 4
  cold_start_influence: 0.25
  source_age_ramp_hours: 24.0
  cold_start_min_observations: 5

# Person B defence stack.  enabled: true is the protected default; the
# health check prints its status on startup and via `trace-rag doctor`.
security:
  enabled: true
  verifier: lexical         # lexical (offline) | nli (DeBERTa cross-encoder) | auto
  max_corroboration: 3
  queue_size: 1000
  drain_queue: true
  fail_open_without_verifier: false
  min_refute_topical_overlap: 1
  # Lexical fallback only: refute needs the passage to cover most of the
  # claim's topic (0.60) while containing almost none of its answer terms.
  # Low support on a partially related passage is NEUTRAL, not refutation.
  min_refute_topic_coverage: 0.50
  min_refute_query_coverage: 0.60
  support_threshold: 0.50
  refute_threshold: 0.10
  max_source_mass: 0.6
  counterfactual_influence: true
