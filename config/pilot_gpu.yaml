# Integration pilot, not the research experiment.
#
# Purpose: verify the complete real-model path (Contriever -> FAISS -> Llama ->
# DeBERTa NLI -> persistent ledger) on a small subset.  Its numbers are an
# engineering smoke test and must not be reported as research findings.
#
# Suggested scope: 5,000 passages, 20 queries, 2 poisoned targets.  The stream
# runner also requires --steps/--targets; see docs/REAL_MODEL_EVAL.md.
#
# This deliberately keeps the research model identifiers.  If the available GPU
# cannot serve Llama-3.1-8B, do not silently substitute a different model in
# this file: use an explicit --set override and label the result accordingly.
seed: 20260921

ingestion:
  chunk_words: 100
  chunk_overlap_words: 20
  family_backend: exact

embedding:
  backend: huggingface
  model_name: facebook/contriever
  device: auto
  batch_size: 32
  normalize: true

index:
  backend: faiss
  faiss_kind: flat

retrieval:
  candidate_pool: 50
  top_k: 5
  trust_lambda: 1.0
  trust_floor: 0.05

signals:
  neighbourhood_k: 10
  min_corpus_for_isolation: 10000

scorer:
  model_path: null
  target_high_fpr: 0.02
  escalation_budget: 1.0
  calibration: isotonic

generation:
  backend: openai
  model_name: meta-llama/Llama-3.1-8B-Instruct
  base_url: http://localhost:8000/v1
  temperature: 0.0
  seed: 20260921
  max_context_docs: 5
  abstain_evidence_mass: 0.5
  require_citations: true

security:
  enabled: true
  verifier: nli
  max_corroboration: 3
  queue_size: 1000
  drain_queue: true
  fail_open_without_verifier: false

trust:
  quarantine_refutations: 2
  reject_refutations: 3
  burst_window_seconds: 60.0
  burst_min_docs: 4

storage:
  root: runs/pilot
